# Recommended on Linux: the container shares the host network, so the default configuration's
# companions on 127.0.0.1 (the proxy core's DNS on :6666 / :1053 / :2222) are reachable, every
# listener of the configuration (:53, :3066, :3077, ...) is published without a port list, and the
# query log sees the real client addresses. Every listen port of the default configuration (53, 2222,
# 3066, 3077, 3099, 3111, 3333, 4444, 7777, 8888) and the API port 9099 must be free on the host;
# if another service holds one, use the bridge file instead.
services:
  atomdns:
    image: jasonxtt/atomdns:latest
    container_name: atomdns
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./atomdns-data:/cus/atomdns
